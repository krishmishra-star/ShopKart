<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore - ShopKart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="aiSearch.js"></script>
  <script src="darkMode.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="color-arc-layout.png">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

<div class="bg-blue-600 text-white text-sm py-2 text-center">
  Free international shipping on orders over ₹10,000
</div>

<nav class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
  <a href="index.html" class="flex items-center gap-2.5 text-xl font-extrabold text-gray-900 group">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-base font-black tracking-wider transition-all duration-300 group-hover:bg-blue-700 shadow-sm shadow-blue-600/25">
      S
    </div>
    <span class="tracking-tight">Shop<span class="text-blue-600">Kart</span></span>
  </a>
  
  <div class="hidden md:flex items-center bg-gray-100 rounded-md px-4 py-2 w-1/3 border border-gray-300">
    <i class="fa-solid fa-magnifying-glass text-gray-500 mr-2 text-sm"></i>
    <input type="text" id="exploreSearch" placeholder="Search products..." class="bg-transparent border-none outline-none text-sm w-full text-gray-800">
  </div>

  <div class="flex items-center gap-6">
    <a href="explore.html" class="text-blue-600 text-sm font-bold hidden md:block border-b-2 border-blue-600 pb-1">Explore</a>
    <a href="orders.html" class="text-gray-600 hover:text-blue-600 text-sm font-medium hidden md:block">Orders</a>
    <a href="#" id="cartBtn" class="relative text-gray-600 hover:text-blue-600">
      <i class="fa-solid fa-cart-shopping text-lg"></i>
      <span id="cart-count" class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs font-bold px-1.5 rounded-full">0</span>
    </a>
    <div id="authContainer" class="hidden md:block">
      <a href="login.html" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700">
        Sign In
      </a>
    </div>
  </div>
</nav>

<main class="flex-1 px-6 py-8 max-w-6xl mx-auto w-full">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-gray-200 pb-4">
    <div>
      <h1 class="text-3xl font-bold text-gray-900" id="exploreTitle">Products</h1>
      <p class="text-gray-600 mt-1" id="exploreSubtitle">Browse our complete catalogue.</p>
    </div>
    
    <div class="flex items-center gap-2">
      <span class="text-sm font-medium text-gray-600">Filter:</span>
      <select id="categorySelect" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-md px-3 py-2 outline-none focus:ring-1 focus:ring-blue-600">
        <option value="all">All Categories</option>
        <option value="shoes">Footwear</option>
        <option value="watches">Watches</option>
        <option value="fashion">Apparel</option>
        <option value="electronics">Electronics</option>
      </select>
    </div>
  </div>

  <div id="exploreGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-8 gap-y-16">
  </div>
</main>

<footer class="bg-gray-800 text-white px-6 py-12 mt-auto">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-8 max-w-6xl mx-auto">
    <div class="col-span-1 md:col-span-2">
      <h3 class="text-xl font-bold mb-4">ShopKart</h3>
      <p class="text-gray-400 text-sm">A simple, modern e-commerce application.</p>
    </div>
    <div>
      <h4 class="font-bold mb-4 text-gray-300">Links</h4>
      <ul class="space-y-2 text-sm text-gray-400">
        <li><a href="#" class="hover:text-white">Products</a></li>
        <li><a href="#" class="hover:text-white">Featured</a></li>
        <li><a href="#" class="hover:text-white">Contact</a></li>
      </ul>
    </div>
  </div>
  <div class="max-w-6xl mx-auto mt-8 pt-8 border-t border-gray-700 text-sm text-gray-400">
    &copy; 2026 ShopKart. All rights reserved.
  </div>
</footer>


<div id="cartOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50"></div>
<div id="cartSidebar" class="fixed top-0 right-0 w-[400px] max-w-[100vw] h-full bg-white shadow-lg z-50 flex flex-col translate-x-full transition-transform duration-300">
  <div class="flex justify-between items-center px-6 py-4 border-b border-gray-200">
    <h3 class="text-lg font-bold text-gray-800">Shopping Cart</h3>
    <button id="closeCart" class="text-gray-500 hover:text-gray-800">
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
  </div>
  <div class="flex-1 overflow-y-auto px-6 py-4" id="cartItems"></div>
  <div class="p-6 border-t border-gray-200 bg-gray-50">
    <div class="flex justify-between items-center mb-4">
      <span class="text-gray-600 font-medium">Total</span>
      <strong class="text-xl font-bold text-gray-900">₹<span id="totalPrice">0</span></strong>
    </div>
    <button id="checkoutBtn" class="w-full py-3 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700">
      Checkout
    </button>
  </div>
</div>

<div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-md shadow-lg hidden z-50"></div>

<script src="data.js"></script>
<script src="cart.js"></script>
<script src="session.js"></script>
<script src="explore.js"></script>
</body>
</html>
