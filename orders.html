<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ShopKart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="darkMode.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="color-arc-layout.png">
</head>

<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

  <div class="bg-blue-600 text-white text-sm py-2 text-center">
    Free international shipping on orders over ₹10,000
  </div>

  <nav
    class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
    <a href="index.html" class="flex items-center gap-2.5 text-xl font-extrabold text-gray-900 group">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-base font-black tracking-wider transition-all duration-300 group-hover:bg-blue-700 shadow-sm shadow-blue-600/25">
        S
      </div>
      <span class="tracking-tight">Shop<span class="text-blue-600">Kart</span></span>
    </a>
    <div class="flex items-center gap-6">
      <a href="explore.html" class="text-gray-600 hover:text-blue-600 text-sm font-medium hidden md:block">Explore</a>
      <a href="orders.html" class="text-blue-600 font-bold hidden md:block border-b-2 border-blue-600 pb-1">Orders</a>
      <a href="#" id="cartBtn" class="relative text-gray-600 hover:text-blue-600">
        <i class="fa-solid fa-cart-shopping text-lg"></i>
        <span id="cart-count"
          class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs font-bold px-1.5 rounded-full">0</span>
      </a>
      <div id="authContainer" class="hidden md:block">
        <a href="login.html" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700">
          Sign In
        </a>
      </div>
    </div>
  </nav>

  <main class="flex-1 px-6 py-8 max-w-6xl mx-auto w-full">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">My Orders</h1>
    <div id="ordersContainer" class="w-full">
    </div>
  </main>

  <footer class="bg-gray-800 text-white px-6 py-12 mt-auto">
    <div class="max-w-6xl mx-auto flex justify-between items-center text-sm text-gray-400">
      <p>&copy; 2026 ShopKart. All rights reserved.</p>
    </div>
  </footer>

  <div id="cartOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50"></div>
  <div id="cartSidebar"
    class="fixed top-0 right-0 w-[400px] max-w-[100vw] h-full bg-white shadow-lg z-50 flex flex-col translate-x-full transition-transform duration-300">
    <div class="flex justify-between items-center px-6 py-4 border-b border-gray-200">
      <h3 class="text-lg font-bold text-gray-800">Shopping Cart</h3>
      <button id="closeCart" class="text-gray-500 hover:text-gray-800">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-6 py-4" id="cartItems"></div>
    <div class="p-6 border-t border-gray-200 bg-gray-50">
      <div class="flex justify-between items-center mb-4">
        <span class="text-gray-600 font-medium">Total</span>
        <strong class="text-xl font-bold text-gray-900">₹<span id="totalPrice">0</span></strong>
      </div>
      <button id="checkoutBtn" class="w-full py-3 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700">
        Checkout
      </button>
    </div>
  </div>

  <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-md shadow-lg hidden z-50">
  </div>

  <script src="data.js"></script>
  <script src="cart.js"></script>
  <script src="session.js"></script>
  <script>
    function renderOrders() {
      const orders = JSON.parse(localStorage.getItem('sk_orders') || '[]');
      const container = document.getElementById('ordersContainer');

      if (!orders.length) {
        container.innerHTML = `
        <div class="flex flex-col items-center justify-center py-20 text-gray-500 bg-white border border-gray-200 rounded-md shadow-sm">
          <i class="fa-solid fa-box-open text-5xl mb-4 text-gray-300"></i>
          <p class="text-xl font-medium mb-4 text-gray-600">No order requested</p>
          <a href="explore.html" class="px-6 py-3 bg-blue-600 text-white text-sm font-bold rounded-md hover:bg-blue-700 shadow-md transition-colors">
            Explore the products
          </a>
        </div>
      `;
        return;
      }

      container.innerHTML = orders.map(order => `
      <div class="bg-white border border-gray-200 rounded-md shadow-sm mb-6 overflow-hidden">
        <!-- Order Header -->
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex flex-wrap justify-between items-center gap-4">
          <div class="flex flex-wrap gap-8">
            <div>
              <p class="text-xs text-gray-500 font-medium uppercase tracking-wider mb-1">Order Placed</p>
              <p class="text-sm text-gray-900 font-medium">${order.date}</p>
            </div>
            <div>
              <p class="text-xs text-gray-500 font-medium uppercase tracking-wider mb-1">Total</p>
              <p class="text-sm text-gray-900 font-medium font-semibold text-gray-800">₹${order.total.toLocaleString('en-IN')}</p>
            </div>
            <div>
              <p class="text-xs text-gray-500 font-medium uppercase tracking-wider mb-1">Payment</p>
              <p class="text-sm text-gray-900 font-medium uppercase text-blue-600">${order.method === 'online' ? 'Online Payment (Razorpay)' : 'Cash on Delivery'}</p>
            </div>
          </div>
          <div class="text-right flex-grow sm:flex-grow-0">
            <p class="text-xs text-gray-500 font-medium uppercase tracking-wider mb-1">Order ID</p>
            <p class="text-sm text-gray-900 font-medium text-xs bg-gray-100 border border-gray-200 px-2 py-0.5 rounded">#${order.id}</p>
          </div>
        </div>

        <!-- Amazon Shipment Tracking Timeline -->
        <div class="px-6 py-5 bg-gradient-to-r from-blue-50/20 to-white border-b border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-6 shadow-inner">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-50 rounded-full border border-emerald-100 flex items-center justify-center text-emerald-600 shadow-sm">
              <i class="fa-solid fa-truck-fast text-lg animate-pulse"></i>
            </div>
            <div>
              <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Shipment Status</p>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span class="text-emerald-600 font-extrabold text-sm">${order.status || 'Ready for Shipping'}</span>
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-ping"></span>
              </div>
            </div>
          </div>
          
          <!-- Visual Timeline -->
          <div class="flex-1 max-w-md md:ml-8">
            <div class="relative flex items-center justify-between">
              <!-- Background Bar -->
              <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1 bg-gray-200 z-0 rounded-full"></div>
              <!-- Completed Progress Bar (from Ordered to Ready for Shipping) -->
              <div class="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-emerald-500 z-0 rounded-full" style="width: 33.33%;"></div>
              
              <!-- Stage 1: Ordered -->
              <div class="relative z-10 flex flex-col items-center">
                <div class="w-5 h-5 rounded-full bg-emerald-500 border-2 border-white flex items-center justify-center text-[8px] text-white shadow font-bold">✓</div>
                <span class="text-[9px] font-bold text-emerald-600 mt-1">Ordered</span>
              </div>
              
              <!-- Stage 2: Ready for Shipping -->
              <div class="relative z-10 flex flex-col items-center">
                <div class="w-5 h-5 rounded-full bg-emerald-500 border-2 border-white flex items-center justify-center text-[8px] text-white shadow animate-bounce font-bold">✓</div>
                <span class="text-[9px] font-bold text-emerald-600 mt-1">Ready Shipping</span>
              </div>
              
              <!-- Stage 3: Out for Delivery -->
              <div class="relative z-10 flex flex-col items-center">
                <div class="w-5 h-5 rounded-full bg-gray-200 border-2 border-white flex items-center justify-center text-[8px] text-gray-400 shadow font-bold">3</div>
                <span class="text-[9px] font-medium text-gray-400 mt-1">Out for Delivery</span>
              </div>
              
              <!-- Stage 4: Delivered -->
              <div class="relative z-10 flex flex-col items-center">
                <div class="w-5 h-5 rounded-full bg-gray-200 border-2 border-white flex items-center justify-center text-[8px] text-gray-400 shadow font-bold">4</div>
                <span class="text-[9px] font-medium text-gray-400 mt-1">Delivered</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Items Area -->
        <div class="px-6 py-4 divide-y divide-gray-100 bg-white">
          ${order.items.map(item => `
            <div class="flex items-center gap-4 py-4 first:pt-0 last:pb-0">
              <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded border border-gray-200 bg-gray-100 flex-shrink-0">
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-gray-900 hover:text-blue-600 cursor-pointer transition-colors truncate" onclick="goToProduct(${item.id})">${item.name}</p>
                <p class="text-xs text-gray-500 mt-0.5 capitalize">${item.category || 'Product'}</p>
              </div>
              <div class="text-right text-sm">
                <p class="font-bold text-gray-900">₹${item.price.toLocaleString('en-IN')}</p>
                <p class="text-gray-500 mt-0.5 text-xs">Qty: ${item.quantity}</p>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
    }

    window.goToProduct = function (id) {
      const p = typeof productsData !== 'undefined' ? productsData.find(x => x.id === id) : null;
      if (p) {
        localStorage.setItem("sk_selectedProduct", JSON.stringify(p));
        window.location.href = "product.html";
      }
    };

    async function syncAndRenderOrders() {
      let localOrders = JSON.parse(localStorage.getItem('sk_orders') || '[]');

      try {
        const response = await fetch("https://your-render-url.onrender.com/api/orders");
        if (response.ok) {
          const backendOrders = await response.json();

          // Map backend orders to standard local format
          const mappedBackend = backendOrders.map(bo => ({
            id: bo._id,
            date: new Date(bo.createdAt).toLocaleDateString(),
            items: bo.items || [],
            total: bo.totalPrice,
            method: bo.paymentStatus && bo.paymentStatus.includes("Razorpay") ? "online" : "cod",
            status: bo.status || "Ready for Shipping"
          }));

          // Merge keeping unique order IDs
          const mergedMap = new Map();
          mappedBackend.forEach(o => mergedMap.set(String(o.id), o));
          localOrders.forEach(o => {
            if (!mergedMap.has(String(o.id))) {
              mergedMap.set(String(o.id), o);
            }
          });

          const mergedOrders = Array.from(mergedMap.values());
          // Sort by ID descending
          mergedOrders.sort((a, b) => b.id.toString().localeCompare(a.id.toString()));

          localStorage.setItem('sk_orders', JSON.stringify(mergedOrders));
        }
      } catch (error) {
        console.error("Error syncing orders with backend:", error);
      }

      renderOrders();
    }

    document.addEventListener("DOMContentLoaded", () => {
      syncAndRenderOrders();
    });
  </script>
</body>

</html>
