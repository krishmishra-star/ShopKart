<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - ShopKart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="darkMode.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="color-arc-layout.png">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

<div class="bg-blue-600 text-white text-sm py-2 text-center">
  Free international shipping on orders over ₹1000!
</div>

<nav class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
  <a href="index.html" class="flex items-center gap-2.5 text-xl font-extrabold text-gray-900 group">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-base font-black tracking-wider transition-all duration-300 group-hover:bg-blue-700 shadow-sm shadow-blue-600/25">
      S
    </div>
    <span class="tracking-tight">Shop<span class="text-blue-600">Kart</span></span>
  </a>
  <div class="flex items-center gap-6">
    <a href="explore.html" class="text-gray-600 hover:text-blue-600 text-sm font-medium hidden md:block">Explore</a>
    <a href="orders.html" class="text-gray-600 hover:text-blue-600 text-sm font-medium hidden md:block">Orders</a>
    <a href="#" id="cartBtn" class="relative text-blue-600 font-bold border-b-2 border-blue-600 pb-1">
      <i class="fa-solid fa-cart-shopping text-lg"></i>
      <span id="cart-count" class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs font-bold px-1.5 rounded-full">0</span>
    </a>
    <div id="authContainer" class="hidden md:block">
      <a href="login.html" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700">
        Sign In
      </a>
    </div>
  </div>
</nav>

<main class="flex-1 px-6 py-8 max-w-6xl mx-auto w-full">
  
  <h1 class="text-3xl font-bold text-gray-900 mb-8">Shopping Cart</h1>

  <div class="flex flex-col lg:flex-row gap-8 items-start">
    
    <div class="flex-1 w-full" id="cartPageItems">
    </div>

    <div id="orderSummary" class="w-full lg:w-[350px] flex-shrink-0 bg-white border border-gray-200 rounded-md p-6 sticky top-24 shadow-sm">
      <h2 class="text-lg font-bold text-gray-800 mb-6 border-b border-gray-200 pb-2">Order Summary</h2>

      <div class="space-y-3 text-sm text-gray-600 mb-6 border-b border-gray-200 pb-6">
        <div class="flex justify-between">
          <span>Subtotal</span>
          <span class="font-medium text-gray-900">₹<span id="cartPageTotal">0</span></span>
        </div>
        <div class="flex justify-between">
          <span>Shipping</span>
          <span class="font-medium text-blue-600">Free</span>
        </div>
        <div class="flex justify-between items-end pt-3 text-lg">
          <span class="font-bold text-gray-900">Total</span>
          <span class="font-bold text-gray-900">₹<span id="cartPageFinalTotal">0</span></span>
        </div>
      </div>

      <button id="checkoutPageBtn"
        class="w-full py-3 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 mb-4">
        Proceed to Checkout
      </button>

      <div>
        <p class="text-xs font-medium text-gray-500 mb-2">Promo Code</p>
        <div class="flex gap-2">
          <input
            type="text"
            id="promoInput"
            placeholder="Enter code"
            class="flex-1 px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600"
          >
          <button onclick="applyPromo()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md text-sm font-medium hover:bg-gray-300">
            Apply
          </button>
        </div>
        <p id="promoMsg" class="text-xs font-medium mt-2 hidden"></p>
      </div>
    </div>
  </div>
</main>

<footer class="bg-gray-800 text-white px-6 py-12 mt-auto">
  <div class="max-w-6xl mx-auto flex justify-between items-center text-sm text-gray-400">
    <p>&copy; 2026 ShopKart. All rights reserved.</p>
  </div>
</footer>


<div id="cartOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50"></div>
<div id="cartSidebar" class="fixed top-0 right-0 w-[400px] max-w-[100vw] h-full bg-white shadow-lg z-50 flex flex-col translate-x-full transition-transform duration-300">
  <div class="flex justify-between items-center px-6 py-4 border-b border-gray-200">
    <h3 class="text-lg font-bold text-gray-800">Shopping Cart</h3>
    <button id="closeCart" class="text-gray-500 hover:text-gray-800">
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
  </div>
  <div class="flex-1 overflow-y-auto px-6 py-4" id="cartItems"></div>
  <div class="p-6 border-t border-gray-200 bg-gray-50">
    <div class="flex justify-between items-center mb-4">
      <span class="text-gray-600 font-medium">Total</span>
      <strong class="text-xl font-bold text-gray-900">₹<span id="totalPrice">0</span></strong>
    </div>
    <button id="checkoutBtn" class="w-full py-3 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700">
      Checkout
    </button>
  </div>
</div>

<div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-md shadow-lg hidden z-50"></div>

<!-- Modal cleanups done -->

<script src="data.js"></script>
<script src="cart.js"></script>
<script src="session.js"></script>
<script>
  function renderCartPage(cart) {
    const pageItems = document.getElementById("cartPageItems");
    const pageTotal = document.getElementById("cartPageTotal");
    const orderSummary = document.getElementById("orderSummary");
    if (!pageItems) return;

    if (!cart.length) {
      pageItems.innerHTML = `
        <div class="flex flex-col items-center justify-center py-20 text-gray-500 bg-white border border-gray-200 rounded-md">
          <i class="fa-solid fa-cart-shopping text-4xl mb-4 text-gray-300"></i>
          <p class="text-lg font-medium mb-4">Your cart is empty</p>
          <a href="explore.html" class="px-6 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700">
            Continue Shopping
          </a>
        </div>`;
      if (pageTotal) pageTotal.textContent = "0";
      if (orderSummary) orderSummary.style.display = "none";
      return;
    }

    if (orderSummary) orderSummary.style.display = "block";

    let sum = 0;
    pageItems.innerHTML = cart.map(item => {
      const subtotal = item.price * item.quantity;
      sum += subtotal;
      return `
        <div class="flex flex-col sm:flex-row gap-4 py-6 border-b border-gray-200 items-start sm:items-center bg-white px-4 rounded-md mb-2 border">
          <img src="${item.image}" alt="${item.name}" class="w-24 h-24 object-cover rounded bg-gray-100 border border-gray-200">
          <div class="flex-1">
            <p class="text-xs text-gray-500 capitalize mb-1">${item.category}</p>
            <p class="text-base font-bold text-gray-900">${item.name}</p>
            <p class="text-sm font-medium text-gray-600 mt-1">${fmt(item.price)}</p>
          </div>
          
          <div class="flex items-center gap-2">
            <button onclick="updateQuantity(${item.id}, -1)" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded text-gray-800 hover:bg-gray-200 border border-gray-300">−</button>
            <span class="text-sm font-medium w-6 text-center">${item.quantity}</span>
            <button onclick="updateQuantity(${item.id}, 1)" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded text-gray-800 hover:bg-gray-200 border border-gray-300">+</button>
          </div>
          
          <div class="w-24 text-right flex flex-col items-end gap-2">
            <p class="text-base font-bold text-gray-900">${fmt(subtotal)}</p>
            <button onclick="removeFromCart(${item.id})" class="text-xs text-red-600 hover:underline">
               Remove
            </button>
          </div>
        </div>`;
    }).join("");

    if (pageTotal) pageTotal.textContent = sum.toLocaleString('en-IN');
    
    const final = document.getElementById("cartPageFinalTotal");
    if (final) final.textContent = sum.toLocaleString('en-IN');
  }

  document.addEventListener("DOMContentLoaded", () => {
    renderCartPage(getCart());
  });

  const PROMO_CODES = { "KRISH10": 10, "SHOPKART": 15 };
  function applyPromo() {
    const code = document.getElementById("promoInput").value.trim().toUpperCase();
    const msg  = document.getElementById("promoMsg");
    const discount = PROMO_CODES[code];
    
    msg.classList.remove("hidden", "text-green-600", "text-red-500");
    if (discount) {
      msg.textContent = `DISCOUNT: ${discount}% OFF APPLIED`;
      msg.classList.add("text-green-600");
    } else {
      msg.textContent = "INVALID PROMO CODE";
      msg.classList.add("text-red-500");
    }
  }

  document.getElementById("checkoutPageBtn")?.addEventListener("click", () => {
    if (!getCart().length) {
      showToast("Cart is empty!");
      return;
    }
    window.location.href = "checkout.html";
  });
</script>
</body>
</html>
